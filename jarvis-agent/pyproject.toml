[project]
name = "jarvis-agent"
version = "0.4.0"
description = "A self-editing AI agent — JARVIS with NVIDIA NIM + Telegram integration, device-aware setup wizard and REST API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "litellm>=1.40.0",
    "rich>=13.7.0",
    "prompt-toolkit>=3.0.43",
    "tiktoken>=0.7.0",
    "python-telegram-bot>=21.0",
    "Pillow>=10.0.0",
    "psutil>=5.9.0",
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110.0", "uvicorn[standard]>=0.29.0"]
cuda = ["nvidia-ml-py>=12.550.52"]

[project.scripts]
jarvis = "jarvis.cli:main"
jarvis-api = "jarvis.api:serve"
jarvis-telegram = "jarvis.telegram_bot:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jarvis*"]
