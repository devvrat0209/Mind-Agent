[project]
name = "jarvis-agent"
version = "0.1.0"
description = "A self-editing AI agent — JARVIS that modifies its own code"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "litellm>=1.40.0",
    "rich>=13.7.0",
    "prompt-toolkit>=3.0.43",
    "tiktoken>=0.7.0",
]

[project.scripts]
jarvis = "jarvis.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
